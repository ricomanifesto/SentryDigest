<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SentryDigest has moved</title>
<meta name="robots" content="noindex">
<script>
  // Keep the path, query and fragment from the former project-site address.
  var path = location.pathname.replace(/^\/SentryDigest(?=\/|$)/, "") || "/";
  location.replace("https://sentrydigest.ricomanifesto.com" + path + location.search + location.hash);
</script>
</head>
<body>
<p>SentryDigest is now at <a href="https://sentrydigest.ricomanifesto.com/">https://sentrydigest.ricomanifesto.com/</a>.</p>
</body>
</html>
