name: Publish Production

# The only publisher of the production artifact branch. It is invoked by the
# update workflow after its push, or manually. Every publish runs the
# repository gate on the exact source revision first. While publication is
# disabled in publication/site.json the publisher only builds and validates.

on:
  workflow_call:
    inputs:
      invocation:
        type: string
        required: true
      source_sha:
        type: string
        required: false
        default: ''
    secrets:
      REPO_ACCESS_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      invocation:
        description: 'publish, resume, rollback, resolve or seed'
        type: choice
        options: [publish, resume, rollback, resolve, seed]
        default: resume
      source_sha:
        description: 'Current main commit to publish; blank uses current main (publish only)'
        required: false
      release_key:
        description: 'Target release key (rollback) or the tip release key (resolve)'
        required: false
      reason:
        description: 'Rollback reason'
        required: false
      attestation:
        description: 'Operator attestation (resolve, seed)'
        required: false
      seed_insight:
        description: 'Digest commit of the last delivered SentryInsight dispatch, or none (seed)'
        required: false
      seed_grc:
        description: 'Digest commit of the last delivered GRCInsight dispatch, or none (seed)'
        required: false

permissions:
  contents: write

concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      # No requested source, dependency hook or repository program is run until
      # this runner-owned check proves its relation to a freshly fetched main.
      - name: Verify source provenance
        id: source
        env:
          INVOCATION: ${{ inputs.invocation }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/publisher-main
          trusted_main=$(git rev-parse --verify 'refs/remotes/origin/publisher-main^{commit}')
          case "$INVOCATION" in
            publish)
              if [ "$EVENT_NAME" = workflow_dispatch ]; then
                source_sha="${REQUESTED_SOURCE_SHA:-$trusted_main}"
              else
                source_sha="${REQUESTED_SOURCE_SHA:-$EVENT_SOURCE_SHA}"
              fi
              ;;
            resume|rollback|resolve|seed)
              if [ -n "$REQUESTED_SOURCE_SHA" ]; then
                echo 'source_sha is only supported for publish' >&2
                exit 1
              fi
              source_sha="$trusted_main"
              ;;
            *) echo "Unknown invocation $INVOCATION" >&2; exit 1 ;;
          esac
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Source must be a full commit id' >&2
            exit 1
          fi
          git cat-file -e "${source_sha}^{commit}"
          if ! git merge-base --is-ancestor "$source_sha" "$trusted_main"; then
            echo 'Source is not part of trusted main history' >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$source_sha" != "$trusted_main" ]; then
            echo 'Manual publishing requires current main' >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for rendered-page tests
        if: inputs.invocation == 'publish'
        run: npx playwright install chromium --with-deps

      - name: Run repository gate
        if: inputs.invocation == 'publish'
        run: npm test

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Run publisher
        env:
          INVOCATION: ${{ inputs.invocation }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RELEASE_KEY: ${{ inputs.release_key }}
          REASON: ${{ inputs.reason }}
          ATTESTATION: ${{ inputs.attestation }}
          SEED_INSIGHT: ${{ inputs.seed_insight }}
          SEED_GRC: ${{ inputs.seed_grc }}
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          case "$INVOCATION" in
            publish) set -- --source "$SOURCE_SHA" ;;
            resume) set -- ;;
            rollback) set -- --target "$RELEASE_KEY" --reason "$REASON" ;;
            resolve) set -- --release "$RELEASE_KEY" --attestation "$ATTESTATION" ;;
            seed) set -- --consumer "SentryInsight=$SEED_INSIGHT" --consumer "GRCInsight=$SEED_GRC" --attestation "$ATTESTATION" ;;
            *) echo "Unknown invocation $INVOCATION" >&2; exit 1 ;;
          esac
          node publication/cli.js "$INVOCATION" "$@"
