name: Update Cybersecurity News

on:
  schedule:
    # Run every 3 hours
    - cron: '0 */3 * * *'
  push:
    branches:
      - main
    paths:
      - 'config/news-sources.json'  # Run when config file is updated
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false
  queue: max

jobs:
  update-news:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      head_sha: ${{ steps.commit.outputs.head_sha }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main

      - name: Refresh branch head
        run: git pull --ff-only origin main
      
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for rendered-page tests
        run: npx playwright install chromium --with-deps

      - name: Refresh current SentryInsight findings
        run: node scripts/sync-insight-findings.js
      
      - name: Fetch news and build site
        run: node scripts/fetch-news.js
      
      - name: Generate RSS feed
        run: node scripts/generate-rss.js

      - name: Retain dated digest context
        run: node scripts/digest-archive.js

      - name: Test generated site
        run: npm test

      - name: Upload rendered-page screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentrydigest-rendered-page
          path: test-results/screenshots
          if-no-files-found: warn
          retention-days: 14
      
      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
      
      - name: Commit and push if changes
        id: commit
        run: |
          git add index.html news-data.json feed.xml feed-info.json sentryinsight-findings.json sentryinsight-context.json config/news-sources.json archive sitemap.xml
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changes_made=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update cybersecurity news [automated]"
            git push origin HEAD:refs/heads/main
            echo "changes_made=true" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          # The pushed commit, or the unchanged head, for the publisher.
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Notification authority is read fresh from the remote main head: once
      # publication is active there, the publisher notifies consumers after
      # the release is proved serving and the legacy dispatch is skipped.
      - name: Read current notification authority
        id: authority
        if: steps.commit.outputs.changes_made == 'true'
        run: node publication/cli.js authority
      
      # Trigger downstream analysis tools if changes were made
      - name: Trigger SentryInsight Analysis
        if: steps.commit.outputs.changes_made == 'true' && steps.authority.outputs.mode != 'active'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: ricomanifesto/SentryInsight
          event-type: sentrydigest-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ steps.commit.outputs.commit_sha }}"}'

      - name: Trigger GRC Insight Analysis
        if: steps.commit.outputs.changes_made == 'true' && steps.authority.outputs.mode != 'active'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: ricomanifesto/GRCInsight
          event-type: sentrydigest-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ steps.commit.outputs.commit_sha }}"}'

  # Publishes the pushed commit, or resumes the current release when this run
  # made no commit, so an interrupted publication is always picked up.
  publish:
    if: github.ref == 'refs/heads/main'
    needs: update-news
    uses: ./.github/workflows/publish-production.yml
    with:
      invocation: publish
      source_sha: ${{ needs.update-news.outputs.head_sha }}
    secrets:
      REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
