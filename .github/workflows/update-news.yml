name: Update Cybersecurity News

on:
  schedule:
    # Run every 3 hours
    - cron: '0 */3 * * *'
  push:
    branches:
      - main
    paths:
      - 'config/news-sources.json'  # Run when config file is updated
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false
  queue: max

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Refresh branch head
        run: git pull --ff-only origin "$GITHUB_REF_NAME"
      
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for rendered-page tests
        run: npx playwright install chromium --with-deps

      - name: Refresh current SentryInsight findings
        run: node scripts/sync-insight-findings.js
      
      - name: Fetch news and build site
        run: node scripts/fetch-news.js
      
      - name: Generate RSS feed
        run: node scripts/generate-rss.js

      - name: Retain dated digest context
        run: node scripts/digest-archive.js

      - name: Test generated site
        run: npm test

      - name: Upload rendered-page screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sentrydigest-rendered-page
          path: test-results/screenshots
          if-no-files-found: warn
          retention-days: 14
      
      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
      
      - name: Commit and push if changes
        id: commit
        run: |
          git add index.html news-data.json feed.xml feed-info.json sentryinsight-findings.json config/news-sources.json archive sitemap.xml
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changes_made=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update cybersecurity news [automated]"
            git push
            echo "changes_made=true" >> $GITHUB_OUTPUT
            echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi
      
      # Trigger downstream analysis tools if changes were made
      - name: Trigger SentryInsight Analysis
        if: steps.commit.outputs.changes_made == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: ricomanifesto/SentryInsight
          event-type: sentrydigest-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ steps.commit.outputs.commit_sha }}"}'

      - name: Trigger GRC Insight Analysis
        if: steps.commit.outputs.changes_made == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: ricomanifesto/GRCInsight
          event-type: sentrydigest-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ steps.commit.outputs.commit_sha }}"}'
